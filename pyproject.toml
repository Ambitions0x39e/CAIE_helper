[project]
name = "cie-helper"
version = "0.3.0"
description = "CIE/AP past paper automation and tracker"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Runtime deps packaged for iOS — keep this list pure Python / iOS-wheel-safe.
    # NB: plain "flet" (not flet[all]) — the [all] extra drags in flet-cli ->
    # watchdog, which has no iOS wheel and breaks `flet build ipa`.
    # NB2: UPPER BOUND IS LOAD-BEARING. `flet build` pip-installs this FRESH
    # into the bundle (ignoring uv.lock), while the Flutter client is generated
    # by flet-cli's pinned template. If pip grabs a newer flet (e.g. 0.86.0)
    # than the flet-cli (0.85.3) client, the wire protocol mismatches and the
    # packaged app white-screens (session never registers; main() never runs).
    # When bumping flet-cli/flet-desktop in [dependency-groups], bump this
    # range in lockstep.
    # 2026-07-16: PINNED to 0.85.x by decision — do not bump casually.
    # 0.86.0 is broken on Chinese-codepage Windows (flet#6686 C4819/C2220
    # compile failure + serious_python 4.3.2 pip-install hangs forever during
    # packaging), and this app no longer needs anything from 0.86: the large-PDF
    # RPC issue is solved locally via pypdf page pre-extraction in
    # modules/renderer.py. If an upgrade is ever attempted anyway, bump flet,
    # flet-cli, flet-desktop AND the extension pubspec's flet range in lockstep.
    "flet>=0.85.3,<0.86",
    "flet-pdf-render",  # local native pdfrx render extension
    "pandas>=2.2.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "requests>=2.32.0",
    "pdfminer.six>=20240706",  # segmentation + text extraction (was via pdfplumber)
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
# Legacy Streamlit app (app.py, pages/*) + grade-threshold parsing. NOT part of
# the Flet app and NOT iOS-safe (pdfplumber -> pypdfium2 has no iOS wheel).
legacy = [
    "streamlit>=1.35.0",
    "pdfplumber>=0.11.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
]

[tool.flet.app]
# What gets packaged into app.zip = the whole project dir MINUS these names.
# flet does NOT read .gitignore, so every heavy non-app dir must be listed here
# explicitly or it ships inside the app. Matched by TOP-LEVEL name.
#
# Runtime deps are installed FRESH into the bundle from [project.dependencies]
# (see SERIOUS_PYTHON_SITE_PACKAGES), so the local `.venv` is NOT needed in the
# package — excluding it is safe and removes ~425 MB (it also drags in the whole
# legacy streamlit stack: streamlit/pyarrow/altair/pydeck).
#
# Categories below:
#   dev-only dirs      : extensions*, spikes, tests, dev, in_dev, docs
#   env / vcs / caches : .venv, .git, .claude, .mypy_cache, .pytest_cache,
#                        .ruff_cache, .codegraph, .cursor, __pycache__, dist
#   stray test PDFs    : the loose *.pdf files sitting in the repo root
# (*extensions/ holds the render-extension SOURCE; its Python comes from the
#  installed dep and its Dart from the package's bundled data, so the source
#  tree isn't needed — and a stale nested build/ there overflows the filesystem
#  name-length limit during the copy.)
exclude = [
    # dev-only dirs
    "extensions", "spikes", "tests", "dev", "in_dev", "docs", "packaging", "packaging",
    # environments / vcs / tool caches
    ".venv", ".git", ".claude", ".mypy_cache", ".pytest_cache",
    ".ruff_cache", ".codegraph", ".cursor", "__pycache__", "dist",
    # secrets / dev files — the local root `.env` holds REAL SMTP + API creds and
    # ships inside app.zip even though the runtime only reads ~/.cie_helper/.env,
    # so packaging it is a pure credential leak with zero functional need.
    ".env", ".env.example",
]

[tool.flet.dev_packages]
flet-pdf-render = "extensions/flet_pdf_render"

[tool.uv.sources]
flet-pdf-render = { path = "extensions/flet_pdf_render", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pandas", "pandas.*", "requests", "requests.*",
    "pdfplumber", "pdfplumber.*", "streamlit", "streamlit.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Local Flet extension (extensions/flet_pdf_render) — wired as a build dep in 2B.3.
module = ["flet_pdf_render", "flet_pdf_render.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "fpdf2>=2.8.0",
    "mypy>=1.10.0",
    # flet build/run tooling — local only, NOT packaged for iOS (watchdog).
    # Keep in the SAME minor as the runtime `flet` pin above (see NB2 there):
    # the cli's Flutter client and the bundled Python flet must match.
    "flet-cli>=0.85.3,<0.86",
    "flet-desktop>=0.85.3,<0.86",
    # Legacy deps needed to run the full test suite locally (segmenter fidelity
    # check compares pdfminer vs pdfplumber; visualizer tests need streamlit).
    "pdfplumber>=0.11.0",
    "streamlit>=1.35.0",
]
