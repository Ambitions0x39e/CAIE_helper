[project]
name = "cie-helper"
version = "1.4.1"
description = "CIE/AP past paper automation and tracker"
readme = "README.md"
# Upper bound kept deliberate: PyInstaller freezes whatever interpreter the
# venv runs, so moving to 3.14 means bumping this together with
# [tool.ruff] target-version and [tool.mypy] python_version, then re-running
# the suite on it.
requires-python = ">=3.13,<3.14"

dependencies = [
    # Runtime deps. PyInstaller reads the environment rather than this list,
    # but this is still the declaration of what the app needs to run — a
    # `uv sync --no-dev` has to produce a working app.
    "pywebview>=6.2,<7",
    "pypdfium2>=5.6",
    "pillow>=11.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "requests>=2.32.0",
    "pdfminer.six>=20240706",  # segmentation + text extraction (was via pdfplumber)
    # Writes the 错题本's PDF export by cropping regions out of the original
    # QP. Pure Python, and read+write — pdfminer only parses.
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
# NB: pdfplumber is a dev dep only, for the segmenter fidelity check that
# compares the two engines. Nothing shipped may import it — gt_parser rebuilds
# the threshold tables from pdfminer ruling lines so grade thresholds ship in
# the app rather than hiding behind an extra.
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "requests", "requests.*",
    "pdfplumber", "pdfplumber.*",
    # Ships no py.typed, so every attribute reads as Any. The renderer's
    # geometry is pinned by tests/test_local_renderer.py instead — those assert
    # on returned pixels, which is the part a type checker could not have
    # caught anyway.
    "pypdfium2", "pypdfium2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "fpdf2>=2.8.0",
    "mypy>=1.10.0",
    # Segmenter fidelity check compares pdfminer against pdfplumber.
    "pdfplumber>=0.11.0",
    "pyinstaller>=6.22",
]
