[project]
name = "cie-helper"
version = "0.1.0"
description = "CIE/AP past paper automation and tracker"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "requests>=2.32.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "flet[all]>=0.85.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "requests", "requests.*", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "fpdf2>=2.8.0",
    "mypy>=1.10.0",
]
