name: flet_pdf_render
description: Flet FletPdfRender control
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  # NB: for 0.x versions, ^0.85.3 means <0.86.0 and will CONFLICT when the
  # host app builds with a newer flet — keep this range in sync with the
  # app's flet pin (see cie-helper pyproject NB2).
  flet: ">=0.85.3 <0.87.0"
  flutter:
    sdk: flutter

  # Native PDF renderer (PDFium/PDFKit) — no Python wheel, works on iOS.
  pdfrx: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
