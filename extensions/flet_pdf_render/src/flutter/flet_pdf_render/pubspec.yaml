name: flet_pdf_render
description: Flet FletPdfRender control
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flet: ^0.85.3
  flutter:
    sdk: flutter

  # Native PDF renderer (PDFium/PDFKit) — no Python wheel, works on iOS.
  pdfrx: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
