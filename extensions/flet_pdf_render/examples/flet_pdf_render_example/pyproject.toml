[project]
name = "flet-pdf-render-example"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet-pdf-render",
    # Same lockstep rule as the app's pin (cie-helper pyproject NB2): the
    # bundled Python flet and the flet-cli that generates the Flutter client
    # must share a minor, or the packaged harness white-screens.
    "flet>=0.86.4,<0.87",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.4,<0.87",
    "flet-desktop>=0.86.4,<0.87",
    "flet-web>=0.86.4,<0.87",
]

[tool.flet]
# org name in reverse domain name notation, e.g. "com.mycompany".
# Combined with project.name to build bundle ID for iOS and Android apps
org = "com.mycompany"

# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
product = "flet-pdf-render-example"

# company name to display in about app dialogs
company = "Flet"

# copyright text to display in about app dialogs
copyright = "Copyright (C) 2026 by MyCompany"

[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
flet-pdf-render = "../.." # relative path (forward slashes — cross-platform)

[tool.uv.sources]
flet-pdf-render = { path = "../..", editable = true }
